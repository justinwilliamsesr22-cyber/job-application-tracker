<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS Client via CDN (No npm or build step needed) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1>Job Application Tracker</h1>

    <!-- Authentication Bar -->
    <div id="authSection" class="auth-box">
      <p id="authStatus">Sign in to sync your applications to the cloud</p>
      <div id="authForm" class="auth-controls">
        <input type="email" id="authEmail" placeholder="Email address" />
        <input type="password" id="authPassword" placeholder="Password (min 6 chars)" />
        <button onclick="signIn()">Sign In</button>
        <button class="signup-btn" onclick="signUp()">Create Account</button>
      </div>
      <div id="userBar" class="user-bar" style="display: none;">
        <span id="userEmailDisplay"></span>
        <button class="delete-btn" onclick="signOut()">Sign Out</button>
      </div>
    </div>

    <!-- Main Tracker App (Shown when logged in) -->
    <div id="trackerApp" style="display: none;">
      <p id="counter">Total Applications: 0</p>
      <div class="stats">
        <p>Applied: <span id="appliedCount">0</span></p>
        <p>Interviewing: <span id="interviewingCount">0</span></p>
        <p>Offers: <span id="offerCount">0</span></p>
        <p>Rejected: <span id="rejectedCount">0</span></p>
      </div>

      <div class="form">
        <input type="text" id="company" placeholder="Company Name" />
        <input type="text" id="position" placeholder="Position" />
        <input type="date" id="date" />
        <select id="status">
          <option>Applied</option>
          <option>Interviewing</option>
          <option>Offer</option>
          <option>Rejected</option>
        </select>
        <button id="submitBtn" onclick="addApplication()">Add Application</button>
      </div>

      <div class="controls">
        <input
          type="text"
          id="search"
          placeholder="Search Companies..."
          onkeyup="searchApplications()"
        />
        <button onclick="clearAll()">Clear All Applications</button>

        <select id="sortOption" onchange="sortApplications()">
          <option value="">Sort By</option>
          <option value="company">Company</option>
          <option value="position">Position</option>
          <option value="date">Date Applied</option>
          <option value="status">Status</option>
        </select>

        <button onclick="exportCSV()">Export CSV</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Position</th>
            <th>Date Applied</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="applicationTable"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
